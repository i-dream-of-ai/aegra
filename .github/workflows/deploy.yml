name: Deploy Aegra

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-aegra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and verify Aegra
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 143.198.116.142
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -eu
            cd /opt/aegra-core
            target='${{ github.sha }}'
            before=$(git rev-parse HEAD)
            git fetch origin main
            git merge-base --is-ancestor "$target" origin/main
            git diff --quiet && git diff --cached --quiet || exit 1
            git merge --ff-only "$target"
            test "$(git rev-parse HEAD)" = "$target"
            if git diff --name-only "$before" "$target" | grep -Ev '^(graphs/|tests/|docs/|\.github/)' | grep -q .; then
              docker compose build aegra
              docker compose up -d --no-deps aegra
            elif test "$before" != "$target"; then
              # The deployment mounts graphs/ directly. Load the new modules in one process.
              docker compose restart aegra
            fi
            for i in $(seq 1 60); do
              if docker compose exec -T aegra python -c 'import os,urllib.request; assert urllib.request.urlopen("http://127.0.0.1:" + os.getenv("PORT","8000") + "/health",timeout=3).status==200'; then
                exit 0
              fi
              sleep 2
            done
            exit 1
